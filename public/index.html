<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slice Splitter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <header class="header">
            <h1 class="headline">Slice Splitter</h1>
            <p class="body">Fair pizza bill splitting, slice by slice</p>
        </header>

        <section class="layout">
            <div class="main-col">
                <div class="card">
                    <label class="label" for="totalCost">Total pizza cost ($)</label>
                    <input type="number" id="totalCost" class="input" value="20" min="0" step="0.01" placeholder="0.00">
                </div>

                <div class="card">
                    <div class="card-header">
                        <label class="label">People</label>
                        <button id="addPerson" class="btn add" aria-label="Add person">+ Add</button>
                    </div>
                    <div id="peopleList" class="people-list"></div>
                </div>
            </div>

            <aside class="summary-col">
                <div class="card summary" id="summary">
                    <div class="summary-top">
                        <span class="label">Per slice</span>
                        <span id="perSlice">$0.00</span>
                    </div>
                    <div class="summary-top">
                        <span class="label">Total slices</span>
                        <span id="totalSlices">0</span>
                    </div>
                    <div class="summary-total">
                        <span class="label">Total</span>
                        <div class="total-display" id="totalCostDisplay">$0.00</div>
                    </div>
                    <div id="shareList" class="share-list"></div>
                </div>
            </aside>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
